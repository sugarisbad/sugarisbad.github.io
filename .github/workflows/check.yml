name: Check site (no deploy)

on:
  pull_request:
    branches: [main]
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Check public branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          # The existing order bot URL is explicitly kept by the site owner.
          bot_url = re.compile(r"https://t\.me/sugarisbad_bot(?=[?\"'\s<)]|$)")
          personal_names = re.compile(r"sugarisbad|danila|данила", re.IGNORECASE)
          text_types = {".html", ".xml", ".txt", ".js", ".css", ".json", ".map", ".svg", ".webmanifest"}
          failures = []
          checked = 0
          for path in Path("dist").rglob("*"):
              if not path.is_file() or path.suffix not in text_types:
                  continue
              checked += 1
              text = path.read_text(encoding="utf-8")
              if personal_names.search(bot_url.sub("", text)):
                  failures.append(path)
                  print(f"::error file={path}::Personal name or handle remains in the generated site")
          print(f"Checked {checked} generated text files; failures: {len(failures)}")
          sys.exit(bool(failures))
          PY

      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Install preview browser
        run: |
          npm install --prefix "$RUNNER_TEMP/opsmith-visual-preview" --no-package-lock --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/opsmith-visual-preview/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture visual preview on GitHub runner
        run: node scripts/visual-preview.mjs

      - name: Upload visual preview
        id: visual
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: artifacts/visual-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Link visual preview
        run: echo '[Download visual-preview — open preview.html inside the archive](${{ steps.visual.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
